
services:
  nginx:
    build: ./nginx
    image: nginx
    ports:
      - "8080:80"
    networks:
      - frontend_net
    depends_on:
      - backend

  backend:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    image: python-backend
    networks:
      - frontend_net
      - backend_net
    environment:
      - DATABASE_URL=postgresql://appuser:apppass@db:5432/appdb
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    # ojo: no publicamos puertos acá a propósito.
    # el backend solo debería ser accesible vía nginx.

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true   # esta red no tiene salida a internet ni al host directamente

volumes:
  db_data:
